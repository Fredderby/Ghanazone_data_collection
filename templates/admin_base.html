<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %} | Deeper Life Bible Church</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <script src="{{ url_for('static', filename='admin.js') }}" defer></script>
</head>
<body class="admin-page">
  <div class="admin-shell">
    <aside class="admin-side">
      <div class="admin-brand">
        <img class="logo" src="{{ url_for('static', filename='logo.JPG') }}" alt="Deeper Life Bible Church logo">
        <div>
          <span class="eyebrow">Deeper Life Bible Church</span>
          <strong>Admin panel</strong>
        </div>
      </div>

      <nav class="admin-nav" aria-label="Admin sections">
        <a href="{{ url_for('admin_dashboard') }}" class="{% if request.endpoint == 'admin_dashboard' %}active{% endif %}">Overview</a>
        <a href="{{ url_for('admin_defaulters') }}" class="{% if request.endpoint == 'admin_defaulters' %}active{% endif %}">Defaulters</a>
        <a href="{{ url_for('admin_submissions') }}" class="{% if request.endpoint in ('admin_submissions', 'admin_delete_submission') %}active{% endif %}">Submission report</a>
      </nav>

      <a class="admin-logout" href="{{ url_for('admin_logout') }}">Sign out →</a>
    </aside>

    <main class="admin-main">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="admin-flash {{ category }}" role="status">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
