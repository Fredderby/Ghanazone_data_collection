services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-not-for-production}
      ADMIN_USER: ${ADMIN_USER:-dataanalyst}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-D@taAnalyst2026!}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
